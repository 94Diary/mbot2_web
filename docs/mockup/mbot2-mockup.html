<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mBot2 Maze Ops · Mockup ทุกสถานการณ์</title>
<meta name="description" content="Mockup เว็บ mBot2 Maze Ops ทุกหน้าและทุกสถานการณ์ พร้อมแผงจำลอง">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0b0c0e;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:#fff}
.theme-dark{--bg:#121417;--panel:rgba(34,38,45,.74);--panel-2:rgba(42,47,55,.9);--solid:#1A1E25;--raise:#272C34;--line:rgba(255,255,255,.11);--line-2:rgba(255,255,255,.07);--line-strong:rgba(255,255,255,.22);--ink:#F2F4F7;--ink-2:#CDD2DA;--ink-3:#AAB1BC;--ink-4:#808894;--muted:#5E6672;--grid:#1C2026;--path:#E6E9EE;--orange:#FF6B1A;--orange-ink:#FF8A47;--blue:#1B9BD1;--blue-fill:#0A7FB2;--blue-ink:#5CC8F0;--go:#2BD48A;--warn:#FFB224;--red:#E5251B;--red-ink:#FF6B5E;--go-soft:#0F3B26;--go-line:#1E6B47;--warn-soft:#3D2A05;--warn-line:#6B4A0C;--orange-soft:#2A1608;--orange-line:#6B3410;--orange-soft-ink:#FFD2B3;--blue-soft:#0E3346;--red-soft:#3A0F0B;--lime:#B6E33C;--lime-ink:#B6E33C;--chip:#EEF1F5;--chip-ink:#14161A;--perf:rgba(255,255,255,.05);--overlay:rgba(0,0,0,.55);color-scheme:dark}
.theme-light{--bg:#E8EBEF;--panel:rgba(255,255,255,.78);--panel-2:rgba(255,255,255,.95);--solid:#FFFFFF;--raise:#DCE1E7;--line:#D2D8DF;--line-2:#E0E5EA;--line-strong:#B6BEC8;--ink:#14161A;--ink-2:#2F343B;--ink-3:#4B525C;--ink-4:#636A75;--muted:#96A0AB;--grid:#DADFE5;--path:#14161A;--orange:#F0600F;--orange-ink:#B04400;--blue:#1B9BD1;--blue-fill:#0A7FB2;--blue-ink:#0A6E9C;--go:#127A4B;--warn:#8A5600;--red:#D7261E;--red-ink:#C21C12;--go-soft:#DDF3E8;--go-line:#9BD8BA;--warn-soft:#FCEBCB;--warn-line:#E7C27C;--orange-soft:#FFE7D6;--orange-line:#F2B48C;--orange-soft-ink:#6E2A00;--blue-soft:#D4ECF7;--red-soft:#FBE1DD;--lime:#B6E33C;--lime-ink:#4D7A00;--chip:#FFFFFF;--chip-ink:#14161A;--perf:rgba(20,22,26,.07);--overlay:rgba(20,22,26,.45);color-scheme:light}
.stage{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:0;background:#0b0c0e}
.stage.framed{padding:24px 24px 120px}
.frame{width:100%;min-height:100vh;container-type:inline-size;container-name:app;position:relative;overflow:hidden}
.stage.framed .frame{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 0 0 10px #22252b,0 30px 80px rgba(0,0,0,.5)}
.app{min-height:inherit;background:var(--bg);background-image:radial-gradient(circle,var(--perf) 1.5px,transparent 2px);background-size:20px 20px;color:var(--ink);font-size:15px;line-height:1.55;display:flex;flex-direction:column}
h1,h2,h3,.H{font-family:'Prompt',sans-serif;font-weight:700;margin:0;line-height:1.2}
.M{font-family:'IBM Plex Mono',monospace}
a{color:var(--blue-ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 24px}
@container app (max-width:700px){.wrap{padding:0 16px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#14161A;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn.blue{background:var(--blue-fill);border-color:var(--blue-fill);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn.chip{background:var(--chip);border-color:transparent;color:var(--chip-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),0 0 0 1px var(--line)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost-danger{color:var(--red-ink);border-color:var(--line-strong)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.lg{min-height:54px;padding:0 26px;font-size:17px;font-family:'Prompt',sans-serif}
.btn.icon{width:40px;padding:0;min-height:40px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:none;color:var(--blue-ink);text-decoration:underline;padding:0;font-weight:600}
/* surfaces */
.card{border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(14px)}
.solid{background:var(--solid)}
.pad{padding:20px 22px}
.k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-go{background:var(--go-soft);color:var(--go)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-red{background:var(--red-soft);color:var(--red-ink)}.p-blue{background:var(--blue-soft);color:var(--blue-ink)}.p-or{background:var(--orange-soft);color:var(--orange-soft-ink)}.p-gray{background:var(--line-2);color:var(--ink-2)}.p-ink{background:var(--ink);color:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--raise);border:1px solid var(--line)}
.seg button{border:none;background:transparent;color:var(--ink-2);min-height:34px;padding:0 14px;border-radius:999px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@container app (max-width:1000px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container app (max-width:640px){.g2,.g3,.g4,.g6{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:12px}.wrapr{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.sp{flex:1}
input.in,select.in,textarea.in{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink)}
textarea.in{min-height:120px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field small{font-weight:400;color:var(--ink-3)}
.field .err{color:var(--red-ink);font-weight:500}
.in.bad{border-color:var(--red-ink)}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:400;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--orange)}
.toggle{position:relative;width:46px;height:28px;border-radius:999px;background:var(--muted);border:none;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on{background:var(--go)}.toggle.on::after{transform:translateX(18px)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-4);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase}
table.t td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:hover td{background:var(--line-2)}
.tscroll{overflow-x:auto}
.av{flex:none;display:grid;place-items:center;border-radius:50%;font-family:'Prompt',sans-serif;font-weight:700;color:#14161A}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:16px;font-size:14.5px}
.n-warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn)}
.n-red{background:var(--red-soft);border:1px solid var(--red-ink);color:var(--red-ink)}
.n-blue{background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue-ink)}
.n-go{background:var(--go-soft);border:1px solid var(--go-line);color:var(--go)}
.skel{background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
.fadeup{animation:fadeup .3s cubic-bezier(.16,1,.3,1)}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2);opacity:0}}
.ping{transform-origin:center;transform-box:fill-box;animation:ping 1.8s infinite}
@keyframes glow{50%{opacity:.35}}.led{animation:glow 1.6s infinite}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .9s linear infinite}
/* public header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-family:'Prompt',sans-serif;font-weight:700;font-size:18px;white-space:nowrap}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.nav{display:flex;gap:2px}
.nav button{border:none;background:none;color:var(--ink-3);padding:8px 12px;border-radius:12px;font-size:15px}
.nav button.on{background:var(--raise);color:var(--ink);font-weight:600}
.searchbox{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-3);min-width:220px;background:transparent}
.only-m{display:none!important}
@container app (max-width:900px){.nav,.searchbox,.hide-m{display:none!important}.only-m{display:inline-flex!important}}
.drawer{position:absolute;inset:64px 0 auto 0;z-index:30;background:var(--solid);border-bottom:1px solid var(--line);padding:12px 16px 18px;display:flex;flex-direction:column;gap:4px}
.drawer button{text-align:left;border:none;background:none;color:var(--ink);padding:12px;border-radius:12px;font-size:16px}
.menu{position:absolute;right:0;top:52px;width:290px;z-index:40;background:var(--solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.3);padding:8px}
.menu button,.menu a{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:none;background:none;color:var(--ink);padding:10px;border-radius:10px;text-decoration:none;font-size:14.5px}
.menu button:hover,.menu a:hover{background:var(--line-2)}
.ftr{border-top:1px solid var(--line);margin-top:auto;background:var(--bg)}
.ftr .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding-top:32px;padding-bottom:28px;font-size:14px;color:var(--ink-3)}
.ftr h4{margin:0 0 8px;font-family:'Prompt',sans-serif;color:var(--ink);font-size:15px}
.ftr button{display:block;border:none;background:none;color:var(--ink-3);padding:3px 0;text-align:left;font-size:14px}
.ftr button:hover{color:var(--ink)}
@container app (max-width:800px){.ftr .wrap{grid-template-columns:1fr 1fr}}
.banner{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:14.5px;font-weight:500}
.banner.info{background:var(--blue-soft);color:var(--blue-ink)}.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.red{background:var(--red);color:#fff}
/* console */
.cnav{border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0;z-index:15}
.cnav .wrap{display:flex;align-items:center;gap:6px;min-height:58px;flex-wrap:wrap}
.cnav button{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--ink-3);padding:8px 14px;border-radius:12px;min-height:42px}
.cnav button.on{background:var(--raise);color:var(--ink);font-weight:600}
@container app (max-width:700px){.cnav button span.lbl{display:none}}
/* admin */
.adm{display:flex;flex:1;min-height:0}
.side{width:248px;flex:none;border-right:1px solid var(--line);background:var(--solid);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:flex-start;min-height:100vh}
.side .grp{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--ink-4);text-transform:uppercase;padding:14px 10px 6px}
.side button{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--ink-2);padding:9px 10px;border-radius:12px;text-align:left;font-size:14.5px}
.side button.on{background:var(--raise);color:var(--ink);font-weight:600}
.side button .ct{margin-left:auto;font-size:12px}
.amain{flex:1;min-width:0;display:flex;flex-direction:column}
.atop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
.abody{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
@container app (max-width:900px){.side{display:none}.abody,.atop{padding-left:16px;padding-right:16px}}
/* modal & toast */
.ov{position:absolute;inset:0;z-index:80;background:var(--overlay);display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dr{position:absolute;top:0;right:0;bottom:0;z-index:80;width:min(460px,100%);background:var(--solid);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.3);padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.toasts{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadeup .3s}
.cookie{position:absolute;left:16px;right:16px;bottom:16px;z-index:70;max-width:760px;margin:0 auto;background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
/* mock panel */
.mp{position:fixed;right:16px;bottom:16px;z-index:1000;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:#E9ECF1}
.mp .fab{display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;border:1px solid #3a3f48;background:#16181d;color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.mp .box{position:absolute;right:0;bottom:58px;width:340px;max-height:calc(100vh - 100px);overflow:auto;background:#16181d;border:1px solid #2e333b;border-radius:20px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.mp h5{margin:0;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;color:#8d95a1;text-transform:uppercase}
.mp .opts{display:flex;flex-wrap:wrap;gap:5px}
.mp .opts button{border:1px solid #333944;background:#1f232a;color:#cfd5de;border-radius:999px;padding:5px 11px;font-size:12.5px}
.mp .opts button.on{background:#FF6B1A;border-color:#FF6B1A;color:#14161A;font-weight:700}
.mp select{width:100%;background:#1f232a;color:#e9ecf1;border:1px solid #333944;border-radius:12px;padding:8px 10px;font:inherit;font-size:13.5px}
.mp .tg{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:3px 0;color:#cfd5de}
.mp .tg button{width:38px;height:22px;border-radius:999px;border:none;background:#3a3f48;position:relative}
.mp .tg button::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.mp .tg button.on{background:#2BD48A}.mp .tg button.on::after{transform:translateX(16px)}
.mp .hint{font-size:12px;color:#8d95a1;line-height:1.5}
/* extras */
.app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--ink)}
.stage.framed .app{min-height:calc(100vh - 48px)}
@container app (max-width:900px){.side.open{display:flex;position:absolute;left:0;top:0;bottom:0;z-index:70;box-shadow:20px 0 50px rgba(0,0,0,.35);min-height:0;overflow:auto}}
.res-t td{vertical-align:top;font-size:13.5px}
.res-t td:first-child{font-weight:600;white-space:nowrap}
.yes{color:var(--go)}.no{color:var(--ink-4)}
.stage{height:100vh;min-height:0;align-items:stretch}
.stage.framed{padding:24px}
.frame{height:100%;min-height:0!important;transform:translateZ(0)}
.stage.framed .frame{height:calc(100vh - 48px)}
.scroller{height:100%;overflow:auto;overscroll-behavior:contain}
.app{min-height:100%!important}
.side{min-height:0!important;height:var(--fh,100vh);overflow:auto}
.res-t th,.res-t td{padding:10px 12px}
.noanim .fadeup:not(.toast){animation:none}
/* คอนโซล: แถบเมนูล่างล็อกติดขอบล่างเสมอ */
.conbody{flex:1;display:flex;flex-direction:column}
.cnav{position:sticky;bottom:0;margin-top:auto;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.cnav .wrap{flex-wrap:nowrap}
@container app (max-width:700px){
  .cnav .wrap{gap:0;padding:0 4px;min-height:64px}
  .cnav .sp{display:none}
  .cnav button{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:8px 2px;font-size:11.5px;border-radius:14px;min-height:56px}
  .cnav button span.lbl{display:inline!important;white-space:nowrap}
}
.btn.icon{flex:none}
.botpick{display:grid;gap:16px;grid-template-columns:minmax(150px,.6fr) repeat(3,minmax(0,1fr))}
@container app (max-width:1000px){.botpick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container app (max-width:640px){.botpick{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:2px 16px 6px}.botpick>*{flex:0 0 78%;scroll-snap-align:start}.botpick>:first-child{flex-basis:42%}}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg button{white-space:nowrap;flex:none}
@container app (max-width:440px){.logo span{display:none}}
/* ประวัติแบบยาวลงมา + ตัวแบ่งหน้า */
.hhero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;padding:8px 0 6px}
@container app (max-width:800px){.hhero{grid-template-columns:minmax(0,1fr)}}
.hlatest{padding:14px;text-align:left;color:var(--ink);gap:8px}
.hlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:clip}
.hday{position:sticky;top:64px;z-index:2;padding:8px 18px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);background:var(--raise);border-top:1px solid var(--line)}
.hday:first-child{border-top:none}
.hrow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:none;border-top:1px solid var(--line-2);background:none;color:var(--ink);padding:14px 18px 14px 14px;box-shadow:inset 4px 0 0 var(--rc)}
.hday+.hrow{border-top:none}
.hrow:hover{background:var(--line-2)}
.hid{font-size:20px;width:64px;flex:none}
.hmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

function pager(key, total) {

  const start = (pg - 1) * ps; const end = Math.min(total, start + ps);
  const nums = []; for (let n = 1; n <= pages; n++) if (n === 1 || n === pages || Math.abs(n - pg) <= 1) nums.push(n); else if (nums[nums.length - 1] !== '…') nums.push('…');
  const bt = (n, l, dis, cur) => `<button class="pgb ${cur ? 'on' : ''}" ${dis ? 'disabled' : A('pg', key + ':' + n)} ${cur ? 'aria-current="page"' : ''} aria-label="${typeof l === 'number' ? 'หน้า ' + l : l === '‹' ? 'หน้าก่อน' : 'หน้าถัดไป'}">${l}</button>`;

const termLines = () => { const st = S.ui.step || 0; const L = ['$ colcon build --packages-select mbot2_control mbot2_description --symlink-install', 'Starting >>> mbot2_description', 'Starting >>> mbot2_control'];

  if (!me || !can('admin.access')) return header('') + gate('lock', 'ไม่มีสิทธิ์เข้าหลังบ้าน (403)', me ? `บทบาท${ROLES[S.m.role].name}เข้าหลังบ้านไม่ได้ ถ้าคิดว่าควรเข้าได้ ติดต่อเจ้าของระบบ` : 'เข้าสู่ระบบด้วยบัญชีผู้ดูแลก่อน', me ? `<button class="btn pri" ${A('go', 'home')}>กลับหน้าแรก</button>` : `<button class="btn pri" ${A('go', 'login')}>เข้าสู่ระบบ</button>`) + footer();
  if (APERM[cur] && !can(APERM[cur])) { title = 'ไม่มีสิทธิ์ดูหน้านี้'; sub = ''; actions = ''; body = gate('lock', 'หน้านี้ไม่อยู่ในสิทธิ์ของคุณ', `${ROLES[S.m.role].name}ไม่มีสิทธิ์ “${(PERMS.flatMap((g) => g[1]).find((p) => p[0] === APERM[cur]) || [, ''])[1]}”`, `<button class="btn" ${A('go', firstAdminPage())}>ไปหน้าที่เข้าได้</button>`); }
  const side = ANAV.map(([g, l]) => { const items = l.filter((x) => can(x[3]) || (x[0] === 'a_security' && can('audit.view'))); return items.length ? `<div class="grp">${g}</div>` + items.map(([p, i, n]) => `<button class="${cur === p || (cur === 'a_lesson_edit' && p === 'a_lessons') ? 'on' : ''}" ${A('go', p)}>${ico(i, 18)}<span>${n}</span>${p === 'a_users' ? `<span class="ct pill p-gray">${S.db.users.length}</span>` : ''}</button>`).join('') : ''; }).join('');
  const sideOpen = S.ui.side;
  return `${S.m.maint ? `<div class="banner red">${ico('lock', 16)}<span>โหมดปิดปรับปรุงเปิดอยู่ · คนทั่วไปเข้าเว็บไม่ได้</span><span class="sp"></span><button class="link" style="color:#fff" ${A('maintoff')}>ปิดโหมดนี้</button></div>` : ''}
  <div class="adm"><aside class="side ${sideOpen ? 'open' : ''}" aria-label="เมนูหลังบ้าน">${LOGO}<div class="pill p-ink" style="margin:12px 6px 0;align-self:flex-start">หลังบ้าน · ${ROLES[S.m.role].name}</div>${side}<span class="sp"></span><button ${A('go', 'home')}>${ico('globe', 18)}<span>ดูหน้าเว็บ</span></button><button ${A('console')}>${ico('ctrl', 18)}<span>คอนโซลหุ่น</span></button></aside>
  <div class="amain"><div class="atop"><button class="btn icon only-m" aria-label="เมนูหลังบ้าน" ${A('ui', 'side')}>${ico('menu')}</button><div class="sp"><h1 style="font-size:24px">${title}</h1>${sub ? `<div class="muted" style="font-size:14px">${sub}</div>` : ''}</div>${actions || ''}<button class="btn icon" aria-label="สลับธีม" ${A('theme')}>${ico('theme')}</button><div style="position:relative"><button class="btn icon" style="border:none;padding:0" aria-label="เมนูผู้ใช้" ${A('menu')}>${av(me, 40)}</button>${S.menu ? userMenu(me) : ''}</div></div>
  <div class="abody fadeup">${S.m.loading ? `<div class="grid g4">${skel(4, 110)}</div>${skel(5, 52)}` : body}</div></div></div>`;
}

  clearf: () => { S.f.uq = ''; S.ui.ur = 'all'; S.ui.us = 'all'; render(); },
  uact: (v) => { const u = S.db.users.find((x) => x.id === S.dr.id); const t = { reset: 'ส่งลิงก์ตั้งรหัสผ่านใหม่ให้', logout: 'บังคับออกจากระบบทุกเครื่อง', verify: 'ยืนยันอีเมลแทน' }[v]; if (v === 'verify') u.status = 'active'; audit(meId(), 'user.' + v, `${t} ${u.name}`, u.email); toast(`${t} ${u.name} แล้ว`); },
  suspend: () => { const u = S.db.users.find((x) => x.id === S.dr.id); const d = S.f.dur || '7d'; const until = { '1d': '13 พ.ย. 2569', '7d': '19 พ.ย. 2569', '30d': '12 ธ.ค. 2569', ban: 'ถาวร' }[d]; u.status = d === 'ban' ? 'banned' : 'suspended'; u.ban = { reason: S.f.reason || 'สั่งหยุดหุ่นคนอื่นซ้ำๆ', until, by: ME().name }; audit(meId(), d === 'ban' ? 'user.ban' : 'user.suspend', `${d === 'ban' ? 'แบนถาวร' : 'ระงับบัญชี'} ${u.name}${d === 'ban' ? '' : ' ถึง ' + until}`, 'เหตุผล: ' + u.ban.reason + (S.f.note ? ' · บันทึกภายใน: ' + S.f.note : '')); S.dr.view = 'info'; toast(`${d === 'ban' ? 'แบน' : 'ระงับ'} ${u.name} แล้ว และส่งอีเมลแจ้งแล้ว`); },
  unsuspend: () => { if (!S.f.ureason) return setUI({ ue: true }); const u = S.db.users.find((x) => x.id === S.dr.id); u.status = 'active'; delete u.ban; audit(meId(), 'user.unsuspend', 'ยกเลิกการระงับ ' + u.name, 'เหตุผล: ' + S.f.ureason); S.dr.view = 'info'; toast('ยกเลิกการระงับ ' + u.name + ' แล้ว'); },
  setrole: () => { const u = S.db.users.find((x) => x.id === S.dr.id); const nr = S.f.nr || u.role; if (u.role === 'owner' && nr !== 'owner' && S.db.users.filter((x) => x.role === 'owner').length < 2) return toast('ต้องมีเจ้าของอย่างน้อย 1 คน เพิ่มเจ้าของคนใหม่ก่อน'); if (nr !== u.role) { audit(meId(), 'role.change', 'เปลี่ยนบทบาท ' + u.name, `${ROLES[u.role].name} → ${ROLES[nr].name}`); u.role = nr; } S.dr.view = 'info'; toast('บันทึกบทบาทแล้ว'); },
  deluser: () => { const u = S.db.users.find((x) => x.id === S.dr.id); u.status = 'deleted'; audit(meId(), 'user.delete', 'ลบบัญชี ' + u.name, 'ลบถาวรใน 30 วัน'); S.dr = null; toast('ลบบัญชี ' + u.name + ' แล้ว (กู้คืนได้ 30 วัน)'); },
  invitego: () => { if (!isEmail(S.f.iemail)) return toast('ใส่อีเมลให้ถูกรูปแบบ'); audit(meId(), 'user.invite', 'เชิญ ' + S.f.iemail, 'บทบาท ' + ROLES[S.f.irole || 'member'].name); S.modal = null; toast('ส่งคำเชิญไปที่ ' + S.f.iemail + ' แล้ว'); },

  /* admin: content */
  savelesson: (v) => { const title = S.f.ltitle; const isNew = S.arg === 'new'; const l = isNew ? null : S.db.lessons.find((x) => x.id === +S.arg); if (!(title || (l && l.title))) return setUI({ err: { title: 1 } }); if (isNew) S.db.lessons.push({ id: S.db.lessons.length + 1, title, sum: S.f.lsum || '', body: S.f.lbody || '', status: v, author: ME().name, updated: 'วันนี้' }); else { if (title) l.title = title; if (S.f.lsum != null) l.sum = S.f.lsum; l.status = v; l.updated = 'วันนี้'; } audit(meId(), isNew ? 'lesson.create' : 'lesson.update', (isNew ? 'สร้างบทเรียน ' : 'แก้บทเรียน ') + (title || l.title), v === 'published' ? 'เผยแพร่' : 'บันทึกร่าง'); go('a_lessons'); toast(v === 'published' ? 'เผยแพร่แล้ว' : 'บันทึกร่างแล้ว'); },
  dellessongo: (v) => { const l = S.db.lessons.find((x) => x.id === +v); S.db.lessons = S.db.lessons.filter((x) => x !== l); audit(meId(), 'lesson.delete', 'ลบบทเรียน ' + l.title, 'ย้ายไปถังขยะ 30 วัน'); S.modal = null; toast('ลบบทเรียนแล้ว'); },
  anntog: (v) => { const a = S.db.ann.find((x) => x.id === +v); a.on = !a.on; audit(meId(), 'announce.toggle', (a.on ? 'แสดง' : 'ซ่อน') + 'ประกาศ', a.text); render(); },
  anndel: (v) => { const a = S.db.ann.find((x) => x.id === +v); S.db.ann = S.db.ann.filter((x) => x !== a); audit(meId(), 'announce.delete', 'ลบประกาศ', a.text); toast('ลบประกาศแล้ว'); },
  annsave: () => { if (!S.f.atext) return toast('เขียนข้อความประกาศก่อน'); S.db.ann.unshift({ id: Date.now(), text: S.f.atext, level: S.f.alevel || 'info', on: true, aud: S.f.aaud || 'ทุกคน', until: '—' }); audit(meId(), 'announce.create', 'สร้างประกาศ', S.f.atext); S.modal = null; S.m.announce = true; toast('ประกาศขึ้นบนเว็บแล้ว'); },
  delmissiongo: (v) => { S.db.missions = S.db.missions.filter((m) => m.id !== +v); audit(meId(), 'mission.delete', 'ลบภารกิจ #' + v, 'ลบ log และแผนที่'); S.modal = null; toast('ลบภารกิจ #' + v + ' แล้ว'); },

  /* admin: system */
  setv: (v) => { const [k, val] = kv(v); S.db.settings[k] = val === 'true' ? true : val === 'false' ? false : val; S.ui.dirty = true; render(); },
  savesettings: () => { audit(meId(), 'settings.update', 'แก้ตั้งค่าเว็บ', 'การสมัคร: ' + S.db.settings.reg + ' · ค้นเจอ: ' + (S.db.settings.index ? 'เปิด' : 'ปิด')); S.ui.dirty = false; toast('บันทึกตั้งค่าแล้ว'); },
  mainton: () => set({ modal: 'mainton' }),
  maintongo: () => { S.modal = null; S.m.maint = true; audit(meId(), 'settings.maintenance', 'เปิดโหมดปิดปรับปรุง', 'ปิด → เปิด'); toast('เปิดโหมดปิดปรับปรุงแล้ว'); },
  maintoff: () => { S.modal = null; S.m.maint = false; audit(meId(), 'settings.maintenance', 'ปิดโหมดปิดปรับปรุง', 'เปิด → ปิด'); toast('เว็บกลับมาใช้ได้ทุกคนแล้ว'); },
  sec: (v) => { S.db.sec[v] = !S.db.sec[v]; audit(meId(), 'security.update', 'เปลี่ยนตั้งค่าความปลอดภัย ' + v, S.db.sec[v] ? 'ปิด → เปิด' : 'เปิด → ปิด'); toast('บันทึกแล้ว'); },
  backup: () => { setUI({ bk: true }); later(1800, () => { S.ui.bk = false; S.db.backups.unshift({ when: 'เมื่อสักครู่', kind: 'กดเอง', size: '4.2 MB', where: 'เครื่อง + ไดรฟ์นอก + คลาวด์', ok: true, tested: false }); audit(meId(), 'backup.manual', 'สำรองข้อมูลทันที', 'สำเร็จ · 4.2 MB'); toast('สำรองข้อมูลเสร็จแล้ว'); }); },
  restorego: () => { S.modal = null; audit(meId(), 'backup.restore', 'กู้คืนข้อมูล', 'สำรองข้อมูลปัจจุบันก่อนกู้แล้ว'); toast('กู้คืนเสร็จแล้ว (จำลอง)'); }
});

/* ====== events ====== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a],[data-stop]');
  if (!el || el.dataset.stop) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (el.dataset.a === 'closemodal' && ev.target.closest('[data-stop]')) return;
  if (el.type === 'checkbox' || el.type === 'radio') { /* ปล่อยให้ติ๊กก่อน แล้ว render */ }
  if (S.menu && el.dataset.a !== 'menu') S.menu = false;
  const fn = H[el.dataset.a]; if (fn) fn(el.dataset.v);
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.f) { S.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; if (['hq', 'uq', 'aq'].indexOf(el.dataset.f) >= 0) resetPages(); if (el.dataset.dirty && !S.ui.dirty) { S.ui.dirty = true; render(); } else if (el.dataset.live) render(); }
  if (el.dataset.set) { S.db.settings[el.dataset.set] = el.value; if (!S.ui.dirty) { S.ui.dirty = true; render(); } }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.ui) { S.ui[el.dataset.ui] = el.value; resetPages(); render(); }
  if (el.dataset.pgs) { S.pg[el.dataset.pgs + ':ps'] = +el.value; S.pg[el.dataset.pgs] = 1; render(); }
  if (el.dataset.mp === 'page') { const p = el.value; go(p, p === 'lesson' ? 4 : p === 'mission' ? LIVE - 1 : p === 'a_lesson_edit' ? 3 : p === 'bot' ? 0 : undefined); }
  if (el.dataset.mp === 'preset' && el.value !== '') {
    const [, m, page, ui, dr, fm] = PRESETS[+el.value]; S.db.fullmap = fm ? 'mbot2_seed7_maze.json' : null;
    Object.assign(S, { m: Object.assign(clone(M0), m) }); go(page, page === 'mission' ? LIVE - 1 : undefined);
    if (ui) Object.assign(S.ui, ui); if (dr) S.dr = clone(dr); render();
  }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && (S.modal || S.dr || S.menu)) set({ modal: null, dr: null, menu: false }); });
render();
</script></body></html>
